<div class="global-loader-backdrop" *ngIf="loading$ | async" (click)="onBackdropClick()">
  <div class="global-loader-card" (click)="$event.stopPropagation()">
    <div class="loader-orbit">
      <span class="orbit-dot dot-blue"></span>
      <span class="orbit-dot dot-green"></span>
      <span class="orbit-dot dot-yellow"></span>
      <span class="orbit-dot dot-red"></span>
    </div>

    <h3>{{ message$ | async }}</h3>
    <p>We are preparing everything securely for you.</p>

    <button *ngIf="!isAuthOrLogin((message$ | async))" type="button" class="dismiss-loader-btn" (click)="dismissLoader()">
      Tap to Dismiss Loader
    </button>
  </div>
</div>
