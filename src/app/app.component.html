<ion-app>
  <ng-container *ngIf="isAuthPage$ | async; else appShell">
    <ion-router-outlet></ion-router-outlet>
  </ng-container>

  <ng-template #appShell>
    <ion-menu contentId="main-content" type="overlay" class="app-sidebar">
      <ion-content>
        <div class="menu-header">
          <div class="app-logo">
            <span>D</span>
          </div>
          <div>
            <h2 class="app-name">DeenDesk</h2>
            <p class="app-subtitle">Madrasa Management</p>
          </div>
        </div>

        <ion-list class="menu-list" *ngIf="profile$ | async as profile">
          <ng-container *ngFor="let item of navItems">
            <ion-menu-toggle auto-hide="false" *ngIf="visible(item, profile)">
              <ion-item class="menu-item" routerDirection="root" [routerLink]="item.route" routerLinkActive="active" lines="none">
                <ion-icon slot="start" [name]="item.icon"></ion-icon>
                <ion-label>{{ item.label }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          </ng-container>
        </ion-list>
      </ion-content>
    </ion-menu>

    <div class="app-frame" id="main-content">
      <ion-header class="app-header">
        <ion-toolbar>
          <div class="toolbar-left" slot="start">
            <ion-menu-button class="menu-toggle"></ion-menu-button>
            <ion-title class="header-title">DeenDesk</ion-title>
          </div>
          <div class="toolbar-actions" slot="end" *ngIf="profile$ | async as profile">
            <button class="notification-button" routerLink="/notifications" type="button" aria-label="Notifications">
              <ion-icon name="notifications-outline"></ion-icon>
            </button>
            <button class="header-user user-chip" routerLink="/profile" type="button">
              <img *ngIf="shouldShowFirebaseImage(profile); else defaultHeaderAvatar" [src]="profile.photoURL" alt="Profile" class="user-avatar-small header-avatar-img" (error)="onHeaderImageError()" />
              <ng-template #defaultHeaderAvatar>
                <img [src]="getDefaultAvatar(profile.gender)" alt="Default avatar" class="user-avatar-small header-avatar-img" />
              </ng-template>
              <span>{{ profile.displayName }}</span>
            </button>
            <button class="logout-button" type="button" (click)="logout()" aria-label="Logout">
              <ion-icon name="log-out-outline"></ion-icon>
            </button>
          </div>
        </ion-toolbar>
      </ion-header>

      <ion-router-outlet></ion-router-outlet>
    </div>
  </ng-template>
</ion-app>
