<ion-app>
  <app-global-loader></app-global-loader>

  <ion-split-pane contentId="main-content" [when]="(isAuthPage$ | async) ? false : (splitPaneWhen$ | async)" [disabled]="(isAuthPage$ | async) || false">
    <ion-menu *ngIf="!(isAuthPage$ | async)" contentId="main-content" [type]="menuType$ | async" class="app-sidebar"
              (ionWillOpen)="onMenuWillOpen()"
              (ionDidClose)="onMenuDidClose()">
      <div class="menu-header">
        <div class="app-logo">
          <img
            [src]="logoUrl$ | async"
            alt="App Logo"
            class="sidebar-logo-img"
            (error)="$any($event.target).src = 'assets/images/deendesk-logo.png'"
          />
        </div>
        <div>
          <h2 class="app-name">{{ appName$ | async }}</h2>
          <p class="app-subtitle">{{ subTitle$ | async }}</p>
        </div>
      </div>
      <ion-content>
        <ion-list class="menu-list" *ngIf="profile$ | async as profile">
          <!-- Search bar styled like a menu item -->
          <ion-item class="menu-item search-item" lines="none">
            <ion-icon slot="start" name="search-outline"></ion-icon>
            <ion-input
              placeholder="Search menu..."
              [ngModel]="searchQuery$ | async"
              (ngModelChange)="searchQuery$.next($event)"
              clearInput="true"
            ></ion-input>
          </ion-item>

          <!-- Subtle Dedicated Quran Quick Access Card -->
          <div class="quran-nav-banner">
            <ion-menu-toggle auto-hide="false">
              <div class="quran-sidebar-btn" (click)="navigateToQuran()" [class.active]="isQuranActive()" role="button" tabindex="0">
                <div class="quran-btn-icon">
                  <ion-icon name="book-outline"></ion-icon>
                </div>
                <div class="quran-btn-text">
                  <span class="quran-btn-title">Al-Qur'an</span>
                  <span class="quran-btn-subtitle">Read & Listen</span>
                </div>
                <ion-icon name="chevron-forward-outline" class="quran-btn-arrow"></ion-icon>
              </div>
            </ion-menu-toggle>
          </div>

          <!-- Dedicated Customize App Option for Admins -->
          <div class="quran-nav-banner" *ngIf="profile$ | async as profile">
            <ion-menu-toggle auto-hide="false" *ngIf="canManageBranding(profile)">
              <div class="quran-sidebar-btn customize-sidebar-btn" (click)="openBrandingDialog()" role="button" tabindex="0">
                <div class="quran-btn-icon customize-icon">
                  <ion-icon name="color-palette-outline"></ion-icon>
                </div>
                <div class="quran-btn-text">
                  <span class="quran-btn-title">Customize App</span>
                  <span class="quran-btn-subtitle">Logo, Name & Menus</span>
                </div>
                <ion-icon name="chevron-forward-outline" class="quran-btn-arrow"></ion-icon>
              </div>
            </ion-menu-toggle>
          </div>

          <ion-item-group *ngFor="let group of filteredNavGroups$ | async">
            <ion-item-divider class="menu-divider">
              <ion-label>{{ group.label }}</ion-label>
            </ion-item-divider>

            <ng-container *ngFor="let item of group.items">
              <ng-container *ngIf="item.children && item.children.length; else singleMenuItem">
                <div class="menu-item-with-children">
                  <ion-menu-toggle auto-hide="false">
                    <ion-item class="menu-item parent-menu-item" button="true" routerDirection="root" [routerLink]="item.route" routerLinkActive="active" lines="none">
                      <ion-icon slot="start" [name]="item.icon"></ion-icon>
                      <ion-label>{{ item.displayLabel || item.label }}</ion-label>
                      <span slot="end" class="submenu-arrow-btn" (click)="toggleMenuExpand(item.route, $event)" role="button" tabindex="0" aria-label="Toggle submenu">
                        <ion-icon [name]="isMenuExpanded(item.route) ? 'chevron-down-outline' : 'chevron-forward-outline'"></ion-icon>
                      </span>
                    </ion-item>
                  </ion-menu-toggle>

                  <div class="submenu-container" *ngIf="isMenuExpanded(item.route)">
                    <ng-container *ngFor="let child of item.children">
                      <ion-menu-toggle auto-hide="false">
                        <ion-item class="menu-item child-menu-item" button="true" routerDirection="root" [routerLink]="child.route" routerLinkActive="active" lines="none">
                          <ion-icon slot="start" [name]="child.icon"></ion-icon>
                          <ion-label>{{ child.displayLabel || child.label }}</ion-label>
                        </ion-item>
                      </ion-menu-toggle>
                    </ng-container>
                  </div>
                </div>
              </ng-container>

              <ng-template #singleMenuItem>
                <ion-menu-toggle auto-hide="false">
                  <ion-item class="menu-item" button="true" routerDirection="root" [routerLink]="item.route" routerLinkActive="active" lines="none">
                    <ion-icon slot="start" [name]="item.icon"></ion-icon>
                    <ion-label>{{ item.displayLabel || item.label }}</ion-label>
                  </ion-item>
                </ion-menu-toggle>
              </ng-template>
            </ng-container>
          </ion-item-group>
        </ion-list>
      </ion-content>
    </ion-menu>

    <!-- Adding ion-page guarantees it has absolute position and 100% dimensions,
         fixing the bug where overlay/push modes shrank or disappeared -->
    <div class="app-frame ion-page" id="main-content"
         [class.menu-overlay-active]="(sidebarSettings.sidebarMode$ | async) === 'overlay' && isMenuOpen">
      <ion-header class="app-header" *ngIf="!(isAuthPage$ | async)">
        <ion-toolbar>
          <div class="toolbar-left" slot="start">
            <ion-menu-button class="menu-toggle" [class.ion-hide-lg-up]="(sidebarSettings.sidebarMode$ | async) === 'split'"></ion-menu-button>
            <span class="header-title-text">{{ appName$ | async }}</span>
          </div>
          <div class="toolbar-actions" slot="end" *ngIf="profile$ | async as profile">
            <button *ngIf="profile.role === 'superAdmin'" class="settings-button notification-button" type="button" aria-label="Settings" (click)="openSettings()">
              <ion-icon name="settings-outline"></ion-icon>
            </button>
            <button class="notification-button" routerLink="/notifications" type="button" aria-label="Notifications">
              <ion-icon name="notifications-outline"></ion-icon>
            </button>
            <button class="header-user user-chip" routerLink="/profile" type="button">
              <img
                class="user-avatar-small header-avatar-img"
                [src]="getAvatarUrl(profile)"
                alt="User avatar"
                (load)="onAvatarLoad()"
                (error)="onAvatarError(profile)"
              />
              <span>{{ profile.displayName }}</span>
            </button>
            <button class="logout-button" type="button" (click)="logout()" aria-label="Logout">
              <ion-icon name="log-out-outline"></ion-icon>
            </button>
          </div>
        </ion-toolbar>
      </ion-header>

      <div style="flex: 1; position: relative; width: 100%; display: flex; flex-direction: column;">
        <ion-router-outlet id="main-router-outlet"></ion-router-outlet>
      </div>
    </div>
  </ion-split-pane>
</ion-app>
