<h2 mat-dialog-title>Graduate Student</h2>

<mat-dialog-content>
  <div class="user-summary">
    <div class="avatar-placeholder">
      {{ data.user.displayName | slice:0:1 | uppercase }}
    </div>
    <div class="user-details">
      <h3>{{ data.user.displayName }}</h3>
      <p>Course: {{ data.user.courseId || 'N/A' }} | Admission #: {{ $any(data.user).admissionNumber || 'N/A' }}</p>
    </div>
  </div>

  <form [formGroup]="form" class="dialog-form">
    
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Graduation Title / Remarks</mat-label>
        <input matInput formControlName="reasonText" placeholder="e.g. Hifz Completion 2026">
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Graduation Date</mat-label>
        <input matInput [matDatepicker]="effPicker" formControlName="effectiveDate">
        <mat-datepicker-toggle matIconSuffix [for]="effPicker"></mat-datepicker-toggle>
        <mat-datepicker #effPicker></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Academic Notes & Achievements</mat-label>
        <textarea matInput formControlName="notes" rows="4"></textarea>
      </mat-form-field>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="loading">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid || loading">
    <mat-spinner *ngIf="loading" diameter="20" class="btn-spinner"></mat-spinner>
    <mat-icon *ngIf="!loading">school</mat-icon>
    Graduate Student
  </button>
</mat-dialog-actions>
