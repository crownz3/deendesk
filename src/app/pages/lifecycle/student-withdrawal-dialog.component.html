<h2 mat-dialog-title>Withdraw Student</h2>

<mat-dialog-content>
  <div class="user-summary">
    <div class="avatar-placeholder">
      {{ data.user.displayName | slice:0:1 | uppercase }}
    </div>
    <div class="user-details">
      <h3>{{ data.user.displayName }}</h3>
      <p>Admission #: {{ $any(data.user).admissionNumber || 'N/A' }} | Class: {{ data.user.classId || 'N/A' }}</p>
    </div>
  </div>

  <form [formGroup]="form" class="dialog-form">
    
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Withdrawal Reason</mat-label>
        <mat-select formControlName="reasonCode">
          <mat-option *ngFor="let r of reasons" [value]="r.value">
            {{ r.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Detailed Reason</mat-label>
        <textarea matInput formControlName="reasonText" rows="3" placeholder="Enter detailed reason..."></textarea>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Effective Date</mat-label>
        <input matInput [matDatepicker]="effPicker" formControlName="effectiveDate">
        <mat-datepicker-toggle matIconSuffix [for]="effPicker"></mat-datepicker-toggle>
        <mat-datepicker #effPicker></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Additional Notes</mat-label>
        <textarea matInput formControlName="notes" rows="2"></textarea>
      </mat-form-field>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="loading">Cancel</button>
  <button mat-flat-button color="warn" (click)="submit()" [disabled]="form.invalid || loading">
    <mat-spinner *ngIf="loading" diameter="20" class="btn-spinner"></mat-spinner>
    <mat-icon *ngIf="!loading">no_accounts</mat-icon>
    Withdraw Student
  </button>
</mat-dialog-actions>
