<ion-content>
  <main class="page" *ngIf="profile$ | async as profile">
    <header class="page-header">
      <div>
        <p class="eyebrow">Profile</p>
        <h1>{{ profile.displayName }}</h1>
        <p>{{ profile.email }}</p>
      </div>
      <app-role-badge [role]="profile.role"></app-role-badge>
    </header>

    <section class="profile-panel">
      <div class="photo-area">
        <div class="profile-avatar-wrapper">
          <div class="avatar-loading-overlay" *ngIf="isAvatarLoading && profile.photoURL && !avatarLoadFailed">
            <mat-spinner diameter="28"></mat-spinner>
          </div>

          <img
            class="profile-avatar"
            [src]="getAvatarUrl(profile)"
            alt="Profile image"
            (load)="onAvatarLoad()"
            (error)="onAvatarError(profile)"
          />
        </div>
        <label class="upload-button">
          <input type="file" accept="image/*" (change)="upload($event, profile)" />
          <ion-icon name="camera-outline"></ion-icon>
          {{ uploading ? 'Uploading...' : 'Upload image' }}
        </label>
      </div>

      <form [formGroup]="form" (ngSubmit)="save(profile)">
        <mat-form-field appearance="outline">
          <mat-label>Display name</mat-label>
          <input matInput formControlName="displayName" />
          <mat-error>Display name is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Phone / Mobile Number</mat-label>
          <input matInput formControlName="mobileNumber" />
          <mat-error *ngIf="form.get('mobileNumber')?.hasError('pattern')">Mobile number must contain digits only</mat-error>
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit">Save profile</button>
      </form>
    </section>
  </main>
</ion-content>
