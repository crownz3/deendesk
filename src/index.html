<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Deendesk - Madrasa Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root>
    <div id="deendesk-boot-splash" style="position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, #0B0E23 0%, #050714 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; font-family: 'Poppins', sans-serif; overflow: hidden;">
      <!-- Ambient background radial glow -->
      <div style="position: absolute; width: 450px; height: 450px; background: radial-gradient(circle, rgba(79, 172, 254, 0.12) 0%, rgba(168, 85, 247, 0.08) 45%, transparent 70%); border-radius: 50%; pointer-events: none; animation: pulseGlow 4s ease-in-out infinite;"></div>

      <!-- Floating Micro-particles System (Zero Gravity) -->
      <div style="position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1;">
        <!-- Particle 1: Emerald -->
        <div style="position: absolute; left: 42%; top: 58%; width: 5px; height: 5px; background: #10B981; border-radius: 50%; filter: blur(0.5px); box-shadow: 0 0 8px #10B981; animation: floatP1 2.8s ease-in-out infinite;"></div>
        <!-- Particle 2: Cyan -->
        <div style="position: absolute; left: 56%; top: 52%; width: 6px; height: 6px; background: #00F2FE; border-radius: 50%; filter: blur(0.5px); box-shadow: 0 0 10px #00F2FE; animation: floatP2 3.2s ease-in-out infinite 0.4s;"></div>
        <!-- Particle 3: White -->
        <div style="position: absolute; left: 38%; top: 48%; width: 4px; height: 4px; background: #FFFFFF; border-radius: 50%; filter: blur(0.3px); box-shadow: 0 0 6px #FFFFFF; animation: floatP3 2.5s ease-in-out infinite 0.8s;"></div>
        <!-- Particle 4: Cyan -->
        <div style="position: absolute; left: 62%; top: 45%; width: 5px; height: 5px; background: #4FACFE; border-radius: 50%; filter: blur(0.5px); box-shadow: 0 0 8px #4FACFE; animation: floatP4 3.5s ease-in-out infinite 1.2s;"></div>
        <!-- Particle 5: Emerald -->
        <div style="position: absolute; left: 47%; top: 62%; width: 4px; height: 4px; background: #10B981; border-radius: 50%; filter: blur(0.5px); box-shadow: 0 0 8px #10B981; animation: floatP5 2.9s ease-in-out infinite 0.3s;"></div>
        <!-- Particle 6: Soft Purple -->
        <div style="position: absolute; left: 53%; top: 40%; width: 6px; height: 6px; background: #C084FC; border-radius: 50%; filter: blur(0.5px); box-shadow: 0 0 10px #C084FC; animation: floatP6 3.6s ease-in-out infinite 1.5s;"></div>
        <!-- Particle 7: White -->
        <div style="position: absolute; left: 45%; top: 38%; width: 3px; height: 3px; background: #FFFFFF; border-radius: 50%; box-shadow: 0 0 5px #FFFFFF; animation: floatP7 2.4s ease-in-out infinite 0.9s;"></div>
        <!-- Particle 8: Cyan -->
        <div style="position: absolute; left: 58%; top: 60%; width: 5px; height: 5px; background: #00F2FE; border-radius: 50%; filter: blur(0.5px); box-shadow: 0 0 8px #00F2FE; animation: floatP8 3.1s ease-in-out infinite 1.8s;"></div>
      </div>

      <div style="position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 32px; z-index: 2;">
        <!-- Anti-gravity Levitation Badge -->
        <div style="position: relative; width: 84px; height: 84px; margin-bottom: 24px; animation: levitate 3s ease-in-out infinite; border-radius: 22px;">
          <div style="position: absolute; inset: -4px; border-radius: 26px; background: linear-gradient(135deg, #00F2FE, #4FACFE, #A855F7); opacity: 0.65; filter: blur(10px); animation: badgePulse 2.5s ease-in-out infinite alternate;"></div>
          <img src="assets/images/deendesk-logo.png" alt="DeenDesk Logo" style="position: relative; width: 84px; height: 84px; border-radius: 22px; object-fit: cover; display: block; z-index: 2;" onerror="this.src='assets/icon/favicon.png'" />
        </div>
        
        <!-- Typography -->
        <h1 style="margin: 0 0 6px 0; font-size: 32px; font-weight: 800; color: #FFFFFF !important; -webkit-text-fill-color: #FFFFFF !important; letter-spacing: -0.5px; text-shadow: 0 2px 16px rgba(0, 242, 254, 0.4), 0 2px 8px rgba(0,0,0,0.8);">DeenDesk</h1>
        <p style="margin: 0 0 28px 0; font-size: 14px; font-weight: 500; color: #9CA3AF !important; -webkit-text-fill-color: #9CA3AF !important; letter-spacing: 0.4px;">Madrasa Management System</p>
        
        <!-- Progress Bar with Neon Glow & Gradient Shimmer -->
        <div style="width: 160px; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 20px; overflow: hidden; position: relative; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);">
          <div style="position: absolute; top: 0; bottom: 0; left: -50%; width: 45%; background: linear-gradient(90deg, #00F2FE 0%, #4FACFE 50%, #00F2FE 100%); border-radius: 20px; box-shadow: 0 0 14px rgba(0, 242, 254, 0.9), 0 0 24px rgba(79, 172, 254, 0.6); animation: gradientShimmer 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
        </div>
        <p style="margin: 16px 0 0 0; font-size: 12px; font-weight: 500; color: #9CA3AF !important; -webkit-text-fill-color: #9CA3AF !important; letter-spacing: 0.3px; opacity: 0.9;">Loading workspace & permissions...</p>
      </div>

      <!-- Footer: Flow - Smart Web & Hybrid Apps -->
      <div style="position: absolute; bottom: 32px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.55); letter-spacing: 0.4px; z-index: 5;">
        <span style="color: rgba(255, 255, 255, 0.55); -webkit-text-fill-color: rgba(255, 255, 255, 0.55);">Powered by</span>
        <span style="color: #38bdf8; -webkit-text-fill-color: #38bdf8; font-weight: 700; letter-spacing: 0.5px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);">Flow - Smart Web & Hybrid Apps</span>
      </div>

      <style>
        @keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.2); opacity: 0.95; } }
        @keyframes levitate {
          0%, 100% { transform: translateY(0px); box-shadow: 0 12px 25px rgba(0, 242, 254, 0.35), 0 0 35px rgba(168, 85, 247, 0.25); }
          50% { transform: translateY(-10px); box-shadow: 0 22px 35px rgba(0, 242, 254, 0.55), 0 0 50px rgba(0, 242, 254, 0.45); }
        }
        @keyframes badgePulse { 0% { opacity: 0.5; filter: blur(8px); } 100% { opacity: 0.85; filter: blur(14px); } }
        @keyframes gradientShimmer { 0% { left: -50%; width: 40%; } 50% { width: 65%; } 100% { left: 110%; width: 40%; } }

        @keyframes floatP1 { 0% { transform: translateY(20px) translateX(0px); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(-70px) translateX(-18px); opacity: 0; } }
        @keyframes floatP2 { 0% { transform: translateY(25px) translateX(0px); opacity: 0; } 50% { opacity: 0.9; } 100% { transform: translateY(-80px) translateX(22px); opacity: 0; } }
        @keyframes floatP3 { 0% { transform: translateY(15px) translateX(0px); opacity: 0; } 50% { opacity: 0.7; } 100% { transform: translateY(-65px) translateX(-12px); opacity: 0; } }
        @keyframes floatP4 { 0% { transform: translateY(20px) translateX(0px); opacity: 0; } 50% { opacity: 0.85; } 100% { transform: translateY(-75px) translateX(15px); opacity: 0; } }
        @keyframes floatP5 { 0% { transform: translateY(30px) translateX(0px); opacity: 0; } 50% { opacity: 0.75; } 100% { transform: translateY(-85px) translateX(-25px); opacity: 0; } }
        @keyframes floatP6 { 0% { transform: translateY(18px) translateX(0px); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(-70px) translateX(20px); opacity: 0; } }
        @keyframes floatP7 { 0% { transform: translateY(22px) translateX(0px); opacity: 0; } 50% { opacity: 0.65; } 100% { transform: translateY(-60px) translateX(-10px); opacity: 0; } }
        @keyframes floatP8 { 0% { transform: translateY(28px) translateX(0px); opacity: 0; } 50% { opacity: 0.85; } 100% { transform: translateY(-80px) translateX(16px); opacity: 0; } }
      </style>
    </div>
  </app-root>
</body>

</html>
